  <text x="938" y="-260" class="rain5" opacity=".3">AI<tspan x="938" dy="20">01</tspan><tspan x="938" dy="20">SYS</tspan><tspan x="938" dy="20">RDP</tspan><tspan x="938" dy="20">10</tspan><tspan x="938" dy="20">INFRA</tspan></text>
  <text x="998" y="-80" class="rain6" opacity=".17">1<tspan x="998" dy="20">0</tspan><tspan x="998" dy="20">API</tspan><tspan x="998" dy="20">AI</tspan><tspan x="998" dy="20">DOCKER</tspan><tspan x="998" dy="20">01</tspan></text>
  <text x="1062" y="-190" class="rain7" opacity=".26">NET<tspan x="1062" dy="20">11</tspan><tspan x="1062" dy="20">BAK</tspan><tspan x="1062" dy="20">OS</tspan><tspan x="1062" dy="20">AI</tspan><tspan x="1062" dy="20">SYS</tspan></text>
  <text x="1122" y="-40" class="rain8" opacity=".16">01<tspan x="1122" dy="20">VPN</tspan><tspan x="1122" dy="20">AI</tspan><tspan x="1122" dy="20">NET</tspan><tspan x="1122" dy="20">10</tspan><tspan x="1122" dy="20">OPS</tspan></text>
</g>

