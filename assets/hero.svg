<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">TimaBak — Building Systems, AI &amp; Internet Products</title>
  <desc id="desc">Animated terminal-inspired profile header for TimaBak.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050806"/>
      <stop offset="52%" stop-color="#0a0f0c"/>
      <stop offset="100%" stop-color="#030504"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#1aff6b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2cff88" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#1aff6b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b3b27" stroke-width="1" opacity=".16"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .scan { animation: scan 7s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .blink { animation: blink 1s steps(1,end) infinite; }
      .float1 { animation: float1 6s ease-in-out infinite; }
      .float2 { animation: float2 8s ease-in-out infinite; }
      .line1 { opacity: 0; animation: reveal 8s infinite 0s; }
      .line2 { opacity: 0; animation: reveal 8s infinite 1s; }
      .line3 { opacity: 0; animation: reveal 8s infinite 2s; }
      @keyframes scan { 0% { transform: translateY(-20px); opacity: 0 } 10% { opacity:.8 } 90% { opacity:.35 } 100% { transform: translateY(450px); opacity:0 } }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes float1 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
      @keyframes float2 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(7px) } }
      @keyframes reveal { 0%,6% { opacity:0 } 10%,75% { opacity:.92 } 90%,100% { opacity:0 } }
    </style>
  </defs>

  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#1d5c36" stroke-opacity=".7"/>
  <rect x="24" y="24" width="1152" height="382" rx="18" fill="#07100a" fill-opacity=".54" stroke="#173522"/>

  <g class="float1" opacity=".19" fill="#2cff88" class="mono">
    <text x="805" y="86" font-size="13">&gt; deploy --production</text>
    <text x="895" y="118" font-size="13">system.online = true</text>
    <text x="770" y="152" font-size="13">ai.agents.start()</text>
    <text x="920" y="186" font-size="13">network.route()</text>
  </g>
  <g class="float2" opacity=".12" fill="#9df8bd" class="mono">
    <text x="835" y="285" font-size="12">docker compose up -d</text>
    <text x="930" y="318" font-size="12">git push origin main</text>
    <text x="760" y="350" font-size="12">build → ship → iterate</text>
  </g>

  <rect class="scan" x="24" y="-8" width="1152" height="3" fill="url(#greenLine)" filter="url(#glow)"/>

  <circle cx="66" cy="62" r="6" fill="#ff5f57"/>
  <circle cx="88" cy="62" r="6" fill="#febc2e"/>
  <circle cx="110" cy="62" r="6" fill="#28c840"/>
  <text x="142" y="67" class="mono" font-size="15" fill="#6f8878">tima@bakunity:~/profile</text>

  <text x="68" y="128" class="mono" font-size="16" fill="#65d98b">$ whoami</text>
  <text x="68" y="192" class="mono" font-size="54" font-weight="700" letter-spacing="8" fill="#f3fff6">TIMA BAK</text>
  <text x="68" y="234" class="mono" font-size="22" font-weight="600" fill="#2cff88" filter="url(#glow)">BUILDING SYSTEMS, AI &amp; INTERNET PRODUCTS</text>

  <text x="68" y="286" class="mono line1" font-size="18" fill="#c7d8cc">&gt; Founder @ Bakunity</text>
  <text x="68" y="318" class="mono line2" font-size="18" fill="#c7d8cc">&gt; AI · Automation · Infrastructure · Products</text>
  <text x="68" y="350" class="mono line3" font-size="18" fill="#c7d8cc">&gt; OSVED · Bak VPN · Open Source</text>

  <g transform="translate(68 378)">
    <circle class="pulse" cx="7" cy="7" r="7" fill="#2cff88" filter="url(#glow)"/>
    <text x="24" y="13" class="mono" font-size="16" font-weight="700" fill="#2cff88">ONLINE</text>
    <text x="112" y="13" class="mono" font-size="16" fill="#6f8878">// BUILD MODE</text>
    <rect class="blink" x="286" y="-2" width="10" height="18" fill="#2cff88"/>
  </g>
</svg>