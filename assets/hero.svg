<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">TimaBak profile</title><desc id="desc">Animated Matrix-inspired terminal header.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020604"/><stop offset=".48" stop-color="#07100a"/><stop offset="1" stop-color="#010302"/></linearGradient>
<radialGradient id="radar"><stop stop-color="#2cff88" stop-opacity=".13"/><stop offset=".6" stop-color="#2cff88" stop-opacity=".035"/><stop offset="1" stop-color="#2cff88" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="1"><stop stop-color="#2cff88" stop-opacity="0"/><stop offset=".45" stop-color="#2cff88" stop-opacity=".8"/><stop offset=".55" stop-color="#c9ffda"/><stop offset="1" stop-color="#2cff88" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e5132" stroke-width="1" opacity=".12"/></pattern>
<clipPath id="matrixClip"><rect x="720" y="42" width="430" height="416" rx="18"/></clipPath>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.scanline{animation:scanline 7s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.blink{animation:blink 1s steps(1,end) infinite}
.m1{animation:rain 7.4s linear infinite}.m2{animation:rain 9.6s linear infinite -2s}.m3{animation:rain 6.6s linear infinite -4s}.m4{animation:rain 10.5s linear infinite -1s}.m5{animation:rain 8.2s linear infinite -5s}
.p1{animation:p1 9s linear infinite}.p2{animation:p2 9s linear infinite}.p3{animation:p3 9s linear infinite}
.log1{animation:l1 9s linear infinite}.log2{animation:l2 9s linear infinite}.log3{animation:l3 9s linear infinite}.dash{stroke-dasharray:8 10;animation:dash 12s linear infinite}
@keyframes scanline{0%{transform:translateY(-18px);opacity:0}8%{opacity:.75}92%{opacity:.22}100%{transform:translateY(510px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes rain{0%{transform:translateY(-340px);opacity:0}10%{opacity:.65}90%{opacity:.42}100%{transform:translateY(520px);opacity:0}}
@keyframes p1{0%,3%{opacity:0}6%,28%{opacity:1}31%,100%{opacity:0}}@keyframes p2{0%,34%{opacity:0}37%,59%{opacity:1}62%,100%{opacity:0}}@keyframes p3{0%,65%{opacity:0}68%,91%{opacity:1}94%,100%{opacity:0}}
@keyframes l1{0%,5%{opacity:0}9%,76%{opacity:.82}84%,100%{opacity:0}}@keyframes l2{0%,16%{opacity:0}20%,82%{opacity:.82}90%,100%{opacity:0}}@keyframes l3{0%,28%{opacity:0}32%,88%{opacity:.82}96%,100%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-180}}
</style></defs>
<rect width="1200" height="500" rx="26" fill="url(#bg)"/><ellipse cx="940" cy="250" rx="320" ry="240" fill="url(#radar)"/><rect width="1200" height="500" rx="26" fill="url(#grid)"/><rect x="1.5" y="1.5" width="1197" height="497" rx="24.5" fill="none" stroke="#28613d" stroke-opacity=".75"/><path d="M34 92H1166M700 42V458" stroke="#173a25" opacity=".8"/>
<circle cx="64" cy="54" r="6" fill="#ff5f57"/><circle cx="86" cy="54" r="6" fill="#febc2e"/><circle cx="108" cy="54" r="6" fill="#28c840"/><text x="138" y="59" class="m" font-size="14" fill="#688775">root@bakunity://tima.profile</text><text x="930" y="59" class="m" font-size="13" fill="#2cff88">[ MATRIX://ACTIVE ]</text>
<g clip-path="url(#matrixClip)" class="m" fill="#2cff88" font-size="13">
<g class="m1" opacity=".25"><text x="755" y="0">0<tspan x="755" dy="20">1</tspan><tspan x="755" dy="20">B</tspan><tspan x="755" dy="20">A</tspan><tspan x="755" dy="20">K</tspan><tspan x="755" dy="20">1</tspan><tspan x="755" dy="20">0</tspan><tspan x="755" dy="20">AI</tspan><tspan x="755" dy="20">SYS</tspan><tspan x="755" dy="20">NET</tspan></text></g>
<g class="m2" opacity=".17"><text x="820" y="-80">1<tspan x="820" dy="20">0</tspan><tspan x="820" dy="20">01</tspan><tspan x="820" dy="20">AI</tspan><tspan x="820" dy="20">BOT</tspan><tspan x="820" dy="20">SYS</tspan><tspan x="820" dy="20">0</tspan><tspan x="820" dy="20">1</tspan></text></g>
<g class="m3" opacity=".32"><text x="895" y="-160">B<tspan x="895" dy="20">A</tspan><tspan x="895" dy="20">K</tspan><tspan x="895" dy="20">U</tspan><tspan x="895" dy="20">N</tspan><tspan x="895" dy="20">I</tspan><tspan x="895" dy="20">T</tspan><tspan x="895" dy="20">Y</tspan><tspan x="895" dy="20">01</tspan></text></g>
<g class="m4" opacity=".18"><text x="980" y="-40">11<tspan x="980" dy="20">VPN</tspan><tspan x="980" dy="20">01</tspan><tspan x="980" dy="20">NET</tspan><tspan x="980" dy="20">AI</tspan><tspan x="980" dy="20">OPS</tspan></text></g>
<g class="m5" opacity=".24"><text x="1070" y="-120">AI<tspan x="1070" dy="20">01</tspan><tspan x="1070" dy="20">OS</tspan><tspan x="1070" dy="20">VED</tspan><tspan x="1070" dy="20">10</tspan><tspan x="1070" dy="20">SYS</tspan></text></g>
</g>
<circle cx="937" cy="250" r="124" fill="none" stroke="#2cff88" stroke-opacity=".08"/><circle cx="937" cy="250" r="82" fill="none" stroke="#2cff88" stroke-opacity=".12" class="dash"/><circle cx="937" cy="250" r="4.5" fill="#2cff88" class="pulse" filter="url(#glow)"/><path d="M937 250L1080 165M937 250L1045 354M937 250L817 327M937 250L852 166" stroke="#2cff88" stroke-opacity=".18" stroke-width="1.5" class="dash"/>
<g class="m" font-size="12" fill="#8db59a"><text x="1084" y="165">INFRA</text><text x="1048" y="370">VPN</text><text x="770" y="345">OSVED</text><text x="792" y="160">AI</text></g>
<text x="58" y="130" class="m" font-size="15" fill="#65d98b">$ ./boot-profile --mode=build</text><text x="58" y="205" class="m" font-size="60" font-weight="800" letter-spacing="9" fill="#f2fff5">TIMA BAK</text><text x="58" y="244" class="m" font-size="17" fill="#799886">FOUNDER / BUILDER / SYSTEMS THINKER</text>
<g class="m" font-size="20" font-weight="700" fill="#2cff88"><text x="58" y="292" class="p1">BUILDING AI × INFRASTRUCTURE × PRODUCTS</text><text x="58" y="292" class="p2">AUTOMATING BORING WORK INTO SYSTEMS</text><text x="58" y="292" class="p3">SHIPPING USEFUL THINGS ON THE INTERNET</text></g>
<g class="m" font-size="15" fill="#b4c9ba"><text x="58" y="342" class="log1">&gt; bakunity.ecosystem ........ CONNECTED</text><text x="58" y="372" class="log2">&gt; osved.intelligence ........ BUILDING</text><text x="58" y="402" class="log3">&gt; bakvpn.network ............. LIVE</text></g>
<g transform="translate(58 446)"><circle cx="7" cy="7" r="6.5" fill="#2cff88" class="pulse" filter="url(#glow)"/><text x="24" y="12" class="m" font-size="14" font-weight="700" fill="#2cff88">SYSTEM ONLINE</text><text x="158" y="12" class="m" font-size="14" fill="#567263">// BUILD → SHIP → ITERATE</text><rect x="394" y="-2" width="9" height="17" fill="#2cff88" class="blink"/></g>
<rect class="scanline" x="28" y="-12" width="1144" height="2.5" fill="url(#scan)" filter="url(#glow)"/>
</svg>