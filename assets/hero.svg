<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">TimaBak</title><desc id="desc">TimaBak Matrix terminal profile</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#010302"/><stop offset=".46" stop-color="#07100a"/><stop offset="1" stop-color="#020504"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#2cff88" stop-opacity=".18"/><stop offset=".58" stop-color="#2cff88" stop-opacity=".045"/><stop offset="1" stop-color="#2cff88" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#2cff88" stop-opacity="0"/><stop offset=".35" stop-color="#2cff88" stop-opacity=".55"/><stop offset=".5" stop-color="#d9ffe5"/><stop offset=".65" stop-color="#2cff88" stop-opacity=".55"/><stop offset="1" stop-color="#2cff88" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#225a36" stroke-width="1" opacity=".11"/></pattern>
  <clipPath id="rainClip"><rect x="670" y="78" width="490" height="402" rx="18"/></clipPath>
  <style>
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
  .rain1{animation:rain 7.5s linear infinite}.rain2{animation:rain 9.8s linear infinite -2s}.rain3{animation:rain 6.8s linear infinite -4s}.rain4{animation:rain 10.4s linear infinite -1s}.rain5{animation:rain 8.7s linear infinite -5s}.rain6{animation:rain 11.3s linear infinite -6s}.rain7{animation:rain 7.9s linear infinite -3s}.rain8{animation:rain 9.2s linear infinite -7s}
  .scan{animation:scan 6.8s linear infinite}.pulse{animation:pulse 2.1s ease-in-out infinite}.blink{animation:blink 1s steps(1,end) infinite}.dash{stroke-dasharray:7 10;animation:dash 11s linear infinite}
  .p1{animation:p1 10.5s linear infinite}.p2{animation:p2 10.5s linear infinite}.p3{animation:p3 10.5s linear infinite}
  @keyframes rain{0%{transform:translateY(-390px);opacity:0}8%{opacity:.7}88%{opacity:.42}100%{transform:translateY(560px);opacity:0}}
  @keyframes scan{0%{transform:translateY(-24px);opacity:0}8%{opacity:.95}91%{opacity:.28}100%{transform:translateY(590px);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes dash{to{stroke-dashoffset:-170}}
  @keyframes p1{0%,2%{opacity:0}6%,29%{opacity:1}33%,100%{opacity:0}}@keyframes p2{0%,35%{opacity:0}39%,62%{opacity:1}66%,100%{opacity:0}}@keyframes p3{0%,68%{opacity:0}72%,95%{opacity:1}98%,100%{opacity:0}}
  </style>
</defs>

