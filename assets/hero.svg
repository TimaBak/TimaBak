<linearGradient id="scan" x1="0" x2="1"><stop stop-color="#2cff88" stop-opacity="0"/><stop offset=".42" stop-color="#2cff88" stop-opacity=".7"/><stop offset=".5" stop-color="#e6ffed"/><stop offset=".58" stop-color="#2cff88" stop-opacity=".7"/><stop offset="1" stop-color="#2cff88" stop-opacity="0"/></linearGradient>
