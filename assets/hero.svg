.r1{animation:r 7.2s linear infinite}.r2{animation:r 9.4s linear infinite -1.8s}.r3{animation:r 6.4s linear infinite -4.2s}.r4{animation:r 10.6s linear infinite -1s}.r5{animation:r 8.4s linear infinite -5.1s}.r6{animation:r 11.4s linear infinite -6.2s}.r7{animation:r 7.8s linear infinite -3.4s}.r8{animation:r 9.1s linear infinite -7.1s}
.scan{animation:s 6.5s linear infinite}.p{animation:p 2.15s ease-in-out infinite}.blink{animation:b 1s steps(1,end) infinite}.dash{stroke-dasharray:7 10;animation:d 11s linear infinite}
