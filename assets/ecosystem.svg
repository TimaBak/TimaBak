 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#030604"/><stop offset=".5" stop-color="#09110b"/><stop offset="1" stop-color="#030604"/></linearGradient>
 <filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.p{animation:p 2.5s ease-in-out infinite}.d{stroke-dasharray:7 9;animation:d 13s linear infinite}.f1{animation:f 5s ease-in-out infinite}.f2{animation:f 6.5s ease-in-out infinite reverse}
 @keyframes p{0%,100%{opacity:.45}50%{opacity:1}}@keyframes d{to{stroke-dashoffset:-190}}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 </style>
