name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.en.md"

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%232cff88

      - name: Style matrix and add animated food particles
        run: |
          python - <<'PY'
          from pathlib import Path

          points = [
              (42, 26, 0.0), (86, 86, 1.2), (128, 46, 2.4), (174, 112, 0.7),
              (218, 72, 3.1), (262, 30, 1.8), (308, 126, 4.0), (352, 58, 2.8),
              (398, 96, 0.4), (444, 36, 3.6), (488, 118, 1.5), (532, 66, 4.4),
              (578, 28, 2.1), (624, 104, 0.9), (668, 54, 3.3), (712, 126, 1.1),
              (754, 78, 4.7), (798, 34, 2.6), (836, 108, 0.2), (66, 134, 3.9),
              (196, 24, 1.6), (370, 136, 4.2), (552, 138, 2.9), (730, 18, 1.9)
          ]

          extra_css = """
          <style>
          @keyframes bakFood {
            0%, 14%, 100% { opacity: 0; transform: scale(.45); }
            24%, 60% { opacity: .95; transform: scale(1); }
            74% { opacity: .15; transform: scale(.65); }
          }
          .bak-food {
            fill: #2cff88;
            transform-box: fill-box;
            transform-origin: center;
            animation: bakFood 5200ms ease-in-out infinite;
          }
          </style>
          """

          for path in Path("dist").glob("*.svg"):
              s = path.read_text()
              s = s.replace("width:12px;height:12px", "width:14px;height:14px")
              s = s.replace("--ce:#161b22", "--ce:#0c1d13")
              s = s.replace("--c0:#161b22", "--c0:#0c1d13")

              dots = []
              for i, (x, y, delay) in enumerate(points):
                  r = 2.2 if i % 3 else 2.8
                  dots.append(
                      f'<circle class="bak-food" cx="{x}" cy="{y}" r="{r}" '
                      f'style="animation-delay:-{delay}s"/>'
                  )

              overlay = extra_css + '<g aria-hidden="true">' + ''.join(dots) + '</g>'
              s = s.replace("</svg>", overlay + "</svg>")
              path.write_text(s)
          PY

      - name: Publish snake branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
