name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.en.md"

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%232cff88

      - name: Turn grid into Matrix Snake game
        run: |
          python - <<'PY'
          from pathlib import Path

          DURATION = 24.0

          # Three looping routes. Coordinates are aligned to the contribution grid.
          routes = {
              "a": [(66,18),(210,18),(210,82),(370,82),(370,34),(530,34),(530,98),(690,98),(690,50),(818,50),(818,18),(66,18)],
              "b": [(754,66),(610,66),(610,18),(466,18),(466,98),(322,98),(322,50),(178,50),(178,82),(34,82),(34,34),(754,66)],
              "c": [(130,98),(130,34),(274,34),(274,66),(418,66),(418,18),(562,18),(562,82),(706,82),(706,34),(802,34),(130,98)],
          }

          # Phase offsets make the three snakes feel independent while keeping food synchronized.
          phase = {"a": 0.0, "b": -8.0, "c": -16.0}
          snake_color = {"a":"#2cff88","b":"#63ff9d","c":"#b2ffcb"}

          # Food at route waypoints. "spawn" is percentage when a square appears;
          # "eat" is percentage when the snake head reaches it.
          food_specs = {
              "a": [(1,0,9),(2,0,18),(3,5,27),(4,0,36),(5,18,45),(6,0,55),(7,38,64),(8,0,73),(9,58,82),(10,0,91)],
              "b": [(1,0,9),(2,0,18),(3,0,27),(4,8,36),(5,0,45),(6,24,55),(7,0,64),(8,46,73),(9,0,82),(10,62,91)],
              "c": [(1,0,9),(2,0,18),(3,6,27),(4,0,36),(5,22,45),(6,0,55),(7,42,64),(8,0,73),(9,60,82),(10,0,91)],
          }

          # Half-width katakana + digits + latin fragments: closer to the visual language
          # associated with Matrix code than Chinese text.
          matrix_columns = [
              (18,-70,"ｱｲｳｴｵｶｷｸｹｺ0123456789ZX",0.0),
              (86,-130,"ｻｼｽｾｿﾀﾁﾂﾃﾄ9876543210AI",1.4),
              (154,-42,"ﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ10110101SYS",2.8),
              (226,-105,"ﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘ01001101NET",4.2),
              (298,-56,"ﾙﾚﾛﾜｦﾝｱｶｻﾀ11001010BAK",0.9),
              (370,-118,"ｲｷｼﾁﾆﾋﾐﾘ00110110AI",2.1),
              (442,-38,"ｳｸｽﾂﾇﾌﾑﾙ10010111OPS",3.6),
              (514,-92,"ｴｹｾﾃﾈﾍﾒﾚ01101001API",5.0),
              (586,-146,"ｵｺｿﾄﾉﾎﾓﾛ11010010VPN",1.8),
              (658,-62,"ｱｼﾂﾈﾌﾔﾘ01010110SYS",3.1),
              (730,-122,"ｶｾﾄﾊﾑﾖﾛ10101100NET",4.5),
              (802,-48,"ｻﾃﾉﾍﾒﾜ01100101AI",0.6),
          ]

          for path in Path("dist").glob("*.svg"):
              s = path.read_text()
              s = s.replace("width:12px;height:12px", "width:14px;height:14px")
              if "dark" in path.name:
                  s = s.replace("--ce:#161b22", "--ce:#0a1710")
                  s = s.replace("--c0:#161b22", "--c0:#0a1710")

              # Hide snk's original snake and bottom progress/level bars.
              base_css = """
              <style id="matrix-game-style">
              .u,.s{display:none!important}
              @keyframes matrixRain{
                0%{transform:translateY(-100px);opacity:0}
                10%{opacity:.24}
                82%{opacity:.15}
                100%{transform:translateY(300px);opacity:0}
              }
              .matrix-code{
                fill:#2cff88;
                font-family:"MS Gothic","Yu Gothic","Noto Sans JP","Arial Unicode MS",monospace;
                font-size:10px;
                font-weight:700;
                letter-spacing:1px;
                filter:drop-shadow(0 0 2px rgba(44,255,136,.45));
                animation:matrixRain 8.8s linear infinite;
              }
              .game-food{
                fill:#2cff88;
                stroke:#a8ffc6;
                stroke-width:.55;
                filter:drop-shadow(0 0 2px rgba(44,255,136,.8));
              }
              @keyframes tail1{0%,100%{transform:translateY(-1px)}50%{transform:translateY(3px)}}
              @keyframes tail2{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
              @keyframes tail3{0%,100%{transform:translateY(-3px)}50%{transform:translateY(2px)}}
              @keyframes headPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(44,255,136,.8))}50%{filter:drop-shadow(0 0 5px rgba(44,255,136,1))}}
              .snake-head{
                stroke:#eafff0;
                stroke-width:.7;
                animation:headPulse 1.2s ease-in-out infinite;
              }
              .tail-1{animation:tail1 .62s ease-in-out infinite}
              .tail-2{animation:tail2 .54s ease-in-out infinite}
              .tail-3{animation:tail3 .7s ease-in-out infinite}
              </style>
              """

              glyphs = ['<g aria-hidden="true">']
              for x,y,chars,delay in matrix_columns:
                  spans = "".join(f'<tspan x="{x}" dy="14">{ch}</tspan>' for ch in chars)
                  glyphs.append(
                      f'<text class="matrix-code" x="{x}" y="{y}" '
                      f'style="animation-delay:-{delay}s">{spans}</text>'
                  )
              glyphs.append('</g>')
              glyph_layer = "".join(glyphs)

              css_parts = []
              game_parts = ['<g id="matrix-snake-game" aria-hidden="true">']

              for name, pts in routes.items():
                  # Snake path keyframes.
                  frames = []
                  last = len(pts)-1
                  for i,(x,y) in enumerate(pts):
                      pct = round(i*100/last, 2)
                      frames.append(f'{pct}%{{transform:translate({x}px,{y}px)}}')
                  css_parts.append(
                      f'@keyframes snake_{name}'+'{'+"".join(frames)+'}'
                  )
                  css_parts.append(
                      f'.snake-{name}'+'{'
                      f'animation:snake_{name} {DURATION}s linear infinite;'
                      f'animation-delay:{phase[name]}s'
                      '}'
                  )

                  # Comet/tadpole sprite: bright oval head + tapered wiggling tail.
                  game_parts.append(f'<g class="snake-{name}">')
                  game_parts.append(
                      f'<ellipse class="snake-head" cx="7" cy="7" rx="7.5" ry="5.5" '
                      f'fill="{snake_color[name]}"/>'
                  )
                  game_parts.append(
                      f'<ellipse class="tail-1" cx="-3" cy="7" rx="5.4" ry="3.6" '
                      f'fill="{snake_color[name]}" opacity=".82"/>'
                  )
                  game_parts.append(
                      f'<ellipse class="tail-2" cx="-11" cy="7" rx="4.2" ry="2.7" '
                      f'fill="{snake_color[name]}" opacity=".62"/>'
                  )
                  game_parts.append(
                      f'<ellipse class="tail-3" cx="-18" cy="7" rx="3.0" ry="2.0" '
                      f'fill="{snake_color[name]}" opacity=".42"/>'
                  )
                  game_parts.append(
                      f'<ellipse class="tail-2" cx="-24" cy="7" rx="2.1" ry="1.4" '
                      f'fill="{snake_color[name]}" opacity=".25"/>'
                  )
                  game_parts.append('</g>')

                  # Food is synchronized to the same route/phase. It stays visible until eaten.
                  for idx,spawn,eat in food_specs[name]:
                      # Food sits at the corresponding route waypoint.
                      point_idx = min(idx, len(pts)-2)
                      x,y = pts[point_idx]
                      anim = f'food_{name}_{idx}'
                      if spawn <= 0:
                          kf = (
                              f'0%,{eat-.5}%{{opacity:1;transform:scale(1)}}'
                              f'{eat}%,99.7%{{opacity:0;transform:scale(.55)}}'
                              f'100%{{opacity:1;transform:scale(1)}}'
                          )
                      else:
                          kf = (
                              f'0%,{spawn-.5}%{{opacity:0;transform:scale(.55)}}'
                              f'{spawn}%,{eat-.5}%{{opacity:1;transform:scale(1)}}'
                              f'{eat}%,100%{{opacity:0;transform:scale(.55)}}'
                          )
                      css_parts.append(f'@keyframes {anim}'+'{'+kf+'}')
                      game_parts.append(
                          f'<rect class="game-food" x="{x}" y="{y}" width="12" height="12" rx="2" ry="2" '
                          f'style="transform-box:fill-box;transform-origin:center;'
                          f'animation:{anim} {DURATION}s steps(1,end) infinite;animation-delay:{phase[name]}s"/>'
                      )

              game_parts.append('</g>')
              extra_css = '<style id="matrix-game-animations">' + "".join(css_parts) + '</style>'
              game_layer = "".join(game_parts)

              # Background code comes right after desc, so the actual contribution grid stays above it.
              s = s.replace("</desc>", "</desc>" + base_css + extra_css + glyph_layer, 1)

              # Game layer goes immediately before snk's hidden progress/snake elements.
              marker = '<rect class="u u0"'
              s = s.replace(marker, game_layer + marker, 1)
              path.write_text(s)

          # Versioned aliases force GitHub's image proxy to fetch a fresh asset.
          dark = Path("dist/github-contribution-grid-snake-dark.svg")
          light = Path("dist/github-contribution-grid-snake.svg")
          if dark.exists():
              Path("dist/github-matrix-game-v4.svg").write_text(dark.read_text())
          if light.exists():
              Path("dist/github-matrix-game-v4-light.svg").write_text(light.read_text())
          PY

      - name: Publish game branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
