name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.en.md"

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%232cff88

      - name: Build Matrix live game
        run: |
          python - <<'PY'
          from pathlib import Path
          from math import atan2, degrees, hypot

          # Different prime-ish loop lengths make the combined scene take hours to visibly repeat.
          durations = {"a":29.0, "b":31.0, "c":37.0}
          phase = {"a":0.0, "b":-10.7, "c":-23.4}
          colors = {"a":"#2cff88", "b":"#63ff9d", "c":"#b2ffcb"}

          # A: clockwise perimeter runner, with brief inward dives.
          # B: counter-clockwise perimeter runner, different corners and inner cuts.
          # C: hunter moving across the interior in a non-matching zig-zag.
          routes = {
            "a":[
              (18,2),(210,2),(402,2),(594,2),(818,2),
              (818,34),(754,34),(818,66),(818,98),
              (610,98),(418,98),(226,98),(18,98),
              (18,66),(82,66),(18,34),(18,2)
            ],
            "b":[
              (818,82),(690,82),(562,82),(434,82),(306,82),(178,82),(18,82),
              (18,50),(114,50),(18,18),(178,18),(338,18),(498,18),(658,18),(818,18),
              (818,50),(722,50),(818,82)
            ],
            "c":[
              (98,98),(98,34),(210,34),(210,82),(322,82),(322,18),
              (434,18),(434,66),(546,66),(546,98),(658,98),(658,34),
              (770,34),(770,82),(642,82),(642,18),(514,18),(514,50),
              (386,50),(386,98),(258,98),(258,50),(130,50),(130,98),(98,98)
            ]
          }

          # Some food exists immediately. More spawns later and remains until the assigned snake reaches it.
          # tuple = (route_index, spawn_percent)
          food_plan = {
            "a":[(1,0),(2,0),(3,7),(5,0),(6,18),(8,0),(9,31),(10,0),(11,47),(12,0),(13,63),(14,76),(15,0)],
            "b":[(1,0),(2,6),(3,0),(4,17),(5,0),(6,0),(7,32),(8,0),(9,45),(10,0),(11,58),(12,0),(13,73),(14,84)],
            "c":[(1,0),(2,4),(3,0),(4,12),(5,0),(6,21),(7,0),(8,33),(9,0),(10,44),(11,0),(12,56),(13,0),(14,67),(15,0),(16,74),(17,0),(18,82),(19,0),(20,88),(21,0),(22,93)]
          }

          matrix_columns = [
            (12,-68,"ｱｲｳｴｵｶｷｸｹｺ0123456789ZX",0.0),(72,-126,"ｻｼｽｾｿﾀﾁﾂﾃﾄ9876543210AI",1.2),
            (132,-38,"ﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ10110101SYS",2.4),(194,-108,"ﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘ01001101NET",3.6),
            (256,-52,"ﾙﾚﾛﾜｦﾝｱｶｻﾀ11001010BAK",0.8),(318,-120,"ｲｷｼﾁﾆﾋﾐﾘ00110110AI",2.0),
            (380,-34,"ｳｸｽﾂﾇﾌﾑﾙ10010111OPS",3.2),(442,-90,"ｴｹｾﾃﾈﾍﾒﾚ01101001API",4.4),
            (504,-142,"ｵｺｿﾄﾉﾎﾓﾛ11010010VPN",1.6),(566,-58,"ｱｼﾂﾈﾌﾔﾘ01010110SYS",2.8),
            (628,-116,"ｶｾﾄﾊﾑﾖﾛ10101100NET",4.0),(690,-44,"ｻﾃﾉﾍﾒﾜ01100101AI",0.5),
            (752,-132,"ｱｶｻﾀﾅﾊﾏﾔﾗﾜ10100110BAK",3.0),(814,-54,"ｲｷｼﾁﾆﾋﾐﾘ01011100SYS",1.0)
          ]

          def route_meta(points):
              seg = []
              total = 0.0
              for i in range(len(points)-1):
                x1,y1 = points[i]
                x2,y2 = points[i+1]
                length = hypot(x2-x1, y2-y1)
                total += length
                angle = degrees(atan2(y2-y1, x2-x1))
                seg.append((length, angle))
              cum = [0.0]
              acc = 0.0
              # Small deterministic speed variation: alternate quick and relaxed segments.
              factors = [0.82,1.16,0.9,1.12,0.78,1.2,0.88,1.08]
              weighted = []
              for i,(length,angle) in enumerate(seg):
                weighted.append(length * factors[i % len(factors)])
              denom = sum(weighted)
              for w in weighted:
                acc += w
                cum.append(acc / denom * 100)
              return cum, seg

          for path in Path("dist").glob("*.svg"):
              s = path.read_text()
              s = s.replace("width:12px;height:12px", "width:14px;height:14px")
              if "dark" in path.name:
                s = s.replace("--ce:#161b22", "--ce:#08140d")
                s = s.replace("--c0:#161b22", "--c0:#08140d")

              base_css = """
              <style id="matrix-live-style">
              .u,.s{display:none!important}
              @keyframes matrixRain{
                0%{transform:translateY(-120px);opacity:0}
                8%{opacity:.34}
                78%{opacity:.2}
                100%{transform:translateY(320px);opacity:0}
              }
              .matrix-code{
                fill:#2cff88;
                font-family:"MS Gothic","Yu Gothic","Noto Sans JP","Arial Unicode MS",monospace;
                font-size:10.5px;font-weight:700;letter-spacing:1px;
                filter:drop-shadow(0 0 2.6px rgba(44,255,136,.58));
                animation:matrixRain 8.2s linear infinite;
              }
              .game-food{
                fill:#2cff88;stroke:#baffd1;stroke-width:.6;
                filter:drop-shadow(0 0 2.8px rgba(44,255,136,.9));
              }
              @keyframes tail1{0%,100%{transform:translateY(-1px) rotate(-5deg)}50%{transform:translateY(3px) rotate(8deg)}}
              @keyframes tail2{0%,100%{transform:translateY(2px) rotate(7deg)}50%{transform:translateY(-3px) rotate(-9deg)}}
              @keyframes tail3{0%,100%{transform:translateY(-3px) rotate(-8deg)}50%{transform:translateY(2px) rotate(10deg)}}
              @keyframes headPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(44,255,136,.8))}50%{filter:drop-shadow(0 0 6px rgba(44,255,136,1))}}
              .snake-head{stroke:#edfff3;stroke-width:.7;animation:headPulse 1.1s ease-in-out infinite}
              .tail-1{animation:tail1 .58s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
              .tail-2{animation:tail2 .49s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
              .tail-3{animation:tail3 .67s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
              </style>
              """

              glyphs = ['<g id="matrix-code-bg" aria-hidden="true">']
              for x,y,chars,delay in matrix_columns:
                  spans = "".join(f'<tspan x="{x}" dy="14">{ch}</tspan>' for ch in chars)
                  glyphs.append(f'<text class="matrix-code" x="{x}" y="{y}" style="animation-delay:-{delay}s">{spans}</text>')
              glyphs.append('</g>')
              glyph_layer = "".join(glyphs)

              css_parts = []
              game = ['<g id="matrix-live-game" aria-hidden="true">']

              for name, points in routes.items():
                  pct, seg = route_meta(points)
                  frames = []
                  for i,(x,y) in enumerate(points):
                      if i < len(seg):
                          ang = seg[i][1]
                      else:
                          ang = seg[-1][1]
                      ease = "cubic-bezier(.2,.8,.25,1)" if i % 3 == 0 else ("cubic-bezier(.45,.05,.2,1)" if i % 3 == 1 else "linear")
                      frames.append(f'{pct[i]:.2f}%{{transform:translate({x}px,{y}px) rotate({ang:.1f}deg);animation-timing-function:{ease}}}')
                  css_parts.append(f'@keyframes snake_{name}'+'{'+''.join(frames)+'}')
                  css_parts.append(
                      f'.snake-{name}'+'{'+
                      f'animation:snake_{name} {durations[name]}s linear infinite;'+
                      f'animation-delay:{phase[name]}s;transform-origin:7px 7px'+'}'
                  )

                  # swimmer sprite
                  game.append(f'<g class="snake-{name}">')
                  game.append(f'<ellipse class="snake-head" cx="7" cy="7" rx="7.8" ry="5.7" fill="{colors[name]}"/>')
                  game.append(f'<ellipse class="tail-1" cx="-3" cy="7" rx="5.5" ry="3.5" fill="{colors[name]}" opacity=".84"/>')
                  game.append(f'<ellipse class="tail-2" cx="-11" cy="7" rx="4.3" ry="2.7" fill="{colors[name]}" opacity=".64"/>')
                  game.append(f'<ellipse class="tail-3" cx="-18" cy="7" rx="3.1" ry="2.0" fill="{colors[name]}" opacity=".44"/>')
                  game.append(f'<ellipse class="tail-2" cx="-24" cy="7" rx="2.1" ry="1.35" fill="{colors[name]}" opacity=".25"/>')
                  game.append('</g>')

                  # food: appears, stays, is removed exactly at the route waypoint crossing
                  for n,(route_idx,spawn) in enumerate(food_plan[name], start=1):
                      route_idx = min(route_idx, len(points)-2)
                      x,y = points[route_idx]
                      eat = pct[route_idx]
                      # if spawn is too late for this pass, it belongs to the next pass
                      if spawn >= eat:
                          spawn = max(0, eat - 8)
                      anim = f'food_{name}_{n}'
                      if spawn <= 0:
                          kf = (
                            f'0%,{max(0,eat-.35):.2f}%{{opacity:1;transform:scale(1)}}'
                            f'{eat:.2f}%,99.75%{{opacity:0;transform:scale(.4)}}'
                            f'100%{{opacity:1;transform:scale(1)}}'
                          )
                      else:
                          kf = (
                            f'0%,{max(0,spawn-.25):.2f}%{{opacity:0;transform:scale(.45)}}'
                            f'{spawn:.2f}%,{max(spawn,eat-.35):.2f}%{{opacity:1;transform:scale(1)}}'
                            f'{eat:.2f}%,100%{{opacity:0;transform:scale(.4)}}'
                          )
                      css_parts.append(f'@keyframes {anim}'+'{'+kf+'}')
                      game.append(
                        f'<rect class="game-food" x="{x}" y="{y}" width="12" height="12" rx="2" ry="2" '
                        f'style="transform-box:fill-box;transform-origin:center;animation:{anim} {durations[name]}s steps(1,end) infinite;animation-delay:{phase[name]}s"/>'
                      )

              game.append('</g>')
              extra_css = '<style id="matrix-live-animations">' + ''.join(css_parts) + '</style>'

              s = s.replace("</desc>", "</desc>" + base_css + extra_css + glyph_layer, 1)
              s = s.replace('<rect class="u u0"', ''.join(game) + '<rect class="u u0"', 1)
              path.write_text(s)

          dark = Path("dist/github-contribution-grid-snake-dark.svg")
          light = Path("dist/github-contribution-grid-snake.svg")
          if dark.exists():
              Path("dist/github-matrix-live-v5.svg").write_text(dark.read_text())
          if light.exists():
              Path("dist/github-matrix-live-v5-light.svg").write_text(light.read_text())
          PY

      - name: Publish Matrix live game
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
