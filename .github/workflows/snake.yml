name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"\n      - "README.en.md"

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%232cff88

      - name: Build Matrix world v8
        run: |
          python - <<'PY'
          from pathlib import Path
          from math import atan2, degrees, hypot

          durations = {"a":29.0, "b":31.0, "c":37.0}
          phase = {"a":0.0, "b":-10.7, "c":-23.4}
          colors = {"a":"#2cff88", "b":"#63ff9d", "c":"#b2ffcb"}
          food_colors = ["#2cff88","#32a8ff","#ff4d67","#66ffd1","#7c6cff","#2cff88","#32a8ff"]

          routes = {
            "a":[(18,2),(210,2),(402,2),(594,2),(818,2),(818,34),(754,34),(818,66),(818,98),(610,98),(418,98),(226,98),(18,98),(18,66),(82,66),(18,34),(18,2)],
            "b":[(818,82),(690,82),(562,82),(434,82),(306,82),(178,82),(18,82),(18,50),(114,50),(18,18),(178,18),(338,18),(498,18),(658,18),(818,18),(818,50),(722,50),(818,82)],
            "c":[(98,98),(98,34),(210,34),(210,82),(322,82),(322,18),(434,18),(434,66),(546,66),(546,98),(658,98),(658,34),(770,34),(770,82),(642,82),(642,18),(514,18),(514,50),(386,50),(386,98),(258,98),(258,50),(130,50),(130,98),(98,98)]
          }

          # Vehicle interval uses route indices. The route spends less time in these segments = actual acceleration.
          vehicle = {
            "a":{"type":"bike","start":3,"end":7},
            "b":{"type":"car","start":9,"end":13},
            "c":{"type":"bike","start":12,"end":16},
          }

          food_plan = {
            "a":[(1,0),(2,0),(3,7),(5,0),(6,18),(8,0),(9,31),(10,0),(11,47),(12,0),(13,63),(14,76),(15,0)],
            "b":[(1,0),(2,6),(3,0),(4,17),(5,0),(6,0),(7,32),(8,0),(9,45),(10,0),(11,58),(12,0),(13,73),(14,84)],
            "c":[(1,0),(2,4),(3,0),(4,12),(5,0),(6,21),(7,0),(8,33),(9,0),(10,44),(11,0),(12,56),(13,0),(14,67),(15,0),(16,74),(17,0),(18,82),(19,0),(20,88),(21,0),(22,93)]
          }

          matrix_columns = [
            (12,-68,"ｱｲｳｴｵｶｷｸｹｺ0123456789ZX",0.0),(72,-126,"ｻｼｽｾｿﾀﾁﾂﾃﾄ9876543210AI",1.2),
            (132,-38,"ﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ10110101SYS",2.4),(194,-108,"ﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘ01001101NET",3.6),
            (256,-52,"ﾙﾚﾛﾜｦﾝｱｶｻﾀ11001010BAK",0.8),(318,-120,"ｲｷｼﾁﾆﾋﾐﾘ00110110AI",2.0),
            (380,-34,"ｳｸｽﾂﾇﾌﾑﾙ10010111OPS",3.2),(442,-90,"ｴｹｾﾃﾈﾍﾒﾚ01101001API",4.4),
            (504,-142,"ｵｺｿﾄﾉﾎﾓﾛ11010010VPN",1.6),(566,-58,"ｱｼﾂﾈﾌﾔﾘ01010110SYS",2.8),
            (628,-116,"ｶｾﾄﾊﾑﾖﾛ10101100NET",4.0),(690,-44,"ｻﾃﾉﾍﾒﾜ01100101AI",0.5),
            (752,-132,"ｱｶｻﾀﾅﾊﾏﾔﾗﾜ10100110BAK",3.0),(814,-54,"ｲｷｼﾁﾆﾋﾐﾘ01011100SYS",1.0)
          ]

          def route_meta(name, points):
              weighted = []
              angles = []
              for i in range(len(points)-1):
                  x1,y1 = points[i]; x2,y2 = points[i+1]
                  length = hypot(x2-x1, y2-y1)
                  angle = degrees(atan2(y2-y1, x2-x1))
                  angles.append(angle)
                  # vehicle segments get ~1.7x speed (less time per distance)
                  boost = .58 if vehicle[name]["start"] <= i < vehicle[name]["end"] else 1.0
                  # tiny deterministic variation keeps movement organic without pauses
                  wobble = [1.0,.92,1.08,.96,1.04][i % 5]
                  weighted.append(length * boost * wobble)
              denom = sum(weighted)
              pct=[0.0]; acc=0.0
              for w in weighted:
                  acc += w
                  pct.append(acc/denom*100)
              return pct, angles

          for path in Path("dist").glob("*.svg"):
              s = path.read_text()
              s = s.replace("width:12px;height:12px", "width:14px;height:14px")
              if "dark" in path.name:
                  s = s.replace("--ce:#161b22", "--ce:#08140d").replace("--c0:#161b22", "--c0:#08140d")

              base_css = """
              <style id="matrix-world-style">
              .u,.s{display:none!important}
              @keyframes matrixRain{0%{transform:translateY(-120px);opacity:0}8%{opacity:.34}78%{opacity:.2}100%{transform:translateY(320px);opacity:0}}
              .matrix-code{fill:#2cff88;font-family:"MS Gothic","Yu Gothic","Noto Sans JP","Arial Unicode MS",monospace;font-size:10.5px;font-weight:700;letter-spacing:1px;filter:drop-shadow(0 0 2.6px rgba(44,255,136,.58));animation:matrixRain 8.2s linear infinite}
              .game-food{stroke:#d8ffe5;stroke-width:.55;filter:drop-shadow(0 0 3px currentColor)}
              @keyframes tail1{0%,100%{transform:translateY(-1px) rotate(-5deg)}50%{transform:translateY(3px) rotate(8deg)}}
              @keyframes tail2{0%,100%{transform:translateY(2px) rotate(7deg)}50%{transform:translateY(-3px) rotate(-9deg)}}
              @keyframes tail3{0%,100%{transform:translateY(-3px) rotate(-8deg)}50%{transform:translateY(2px) rotate(10deg)}}
              @keyframes headPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(44,255,136,.8))}50%{filter:drop-shadow(0 0 6px rgba(44,255,136,1))}}
              @keyframes boostTrail{0%,100%{opacity:.18;transform:scaleX(.65)}50%{opacity:.9;transform:scaleX(1.25)}}
              .snake-head{stroke:#edfff3;stroke-width:.7;animation:headPulse 1.1s ease-in-out infinite}
              .tail-1{animation:tail1 .58s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
              .tail-2{animation:tail2 .49s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
              .tail-3{animation:tail3 .67s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
              .boost-line{animation:boostTrail .22s linear infinite;transform-box:fill-box;transform-origin:right center}
              .parked{filter:drop-shadow(0 0 3px rgba(44,255,136,.9))}
              </style>
              """

              glyphs=['<g id="matrix-code-bg" aria-hidden="true">']
              for x,y,chars,delay in matrix_columns:
                  spans="".join(f'<tspan x="{x}" dy="14">{ch}</tspan>' for ch in chars)
                  glyphs.append(f'<text class="matrix-code" x="{x}" y="{y}" style="animation-delay:-{delay}s">{spans}</text>')
              glyphs.append('</g>')

              css=[]; game=['<g id="matrix-live-world" aria-hidden="true">']

              for name,points in routes.items():
                  pct,angles = route_meta(name,points)
                  frames=[]
                  for i,(x,y) in enumerate(points):
                      ang = angles[i] if i < len(angles) else angles[-1]
                      frames.append(f'{pct[i]:.3f}%{{transform:translate({x}px,{y}px) rotate({ang:.1f}deg)}}')
                  css.append(f'@keyframes snake_{name}'+'{'+''.join(frames)+'}')
                  css.append(f'.snake-{name}'+'{'+f'animation:snake_{name} {durations[name]}s linear infinite;animation-delay:{phase[name]}s;transform-origin:7px 7px'+'}')

                  vs=vehicle[name]["start"]; ve=vehicle[name]["end"]
                  start=pct[vs]; end=pct[ve]
                  pre=max(0,start-.25); post=min(100,end+.25)

                  # swimmer/vehicle state on moving actor
                  css.append(f'@keyframes body_{name}'+'{'+f'0%,{pre:.3f}%{{opacity:1}}{start:.3f}%,{end:.3f}%{{opacity:0}}{post:.3f}%,100%{{opacity:1}}'+'}')
                  css.append(f'@keyframes ride_{name}'+'{'+f'0%,{pre:.3f}%{{opacity:0}}{start:.3f}%,{end:.3f}%{{opacity:1}}{post:.3f}%,100%{{opacity:0}}'+'}')
                  css.append(f'@keyframes parked_{name}'+'{'+f'0%,{pre:.3f}%{{opacity:1}}{start:.3f}%,99.75%{{opacity:0}}100%{{opacity:1}}'+'}')

                  # parked vehicle at pickup point
                  px,py=points[vs]
                  parked_cls=f'parked parked-{name}'
                  css.append(f'.parked-{name}'+'{'+f'animation:parked_{name} {durations[name]}s steps(1,end) infinite;animation-delay:{phase[name]}s'+'}')
                  if vehicle[name]["type"]=="bike":
                      game.append(f'<g class="{parked_cls}" transform="translate({px} {py})"><circle cx="2" cy="10" r="3" fill="none" stroke="#2cff88" stroke-width="1.5"/><circle cx="14" cy="10" r="3" fill="none" stroke="#2cff88" stroke-width="1.5"/><path d="M2 10L7 5L10 10H14M7 5H12" fill="none" stroke="#baffd1" stroke-width="1.4"/></g>')
                  else:
                      game.append(f'<g class="{parked_cls}" transform="translate({px} {py})"><rect x="1" y="4" width="17" height="8" rx="2" fill="#32a8ff" stroke="#d9f1ff" stroke-width=".7"/><path d="M5 4L8 1H13L16 4" fill="none" stroke="#d9f1ff" stroke-width="1"/><circle cx="5" cy="13" r="2.2" fill="#07100a" stroke="#d9f1ff"/><circle cx="15" cy="13" r="2.2" fill="#07100a" stroke="#d9f1ff"/></g>')

                  game.append(f'<g class="snake-{name}">')
                  game.append(f'<g style="animation:body_{name} {durations[name]}s steps(1,end) infinite;animation-delay:{phase[name]}s">')
                  game.append(f'<ellipse class="snake-head" cx="7" cy="7" rx="7.8" ry="5.7" fill="{colors[name]}"/>')
                  game.append(f'<ellipse class="tail-1" cx="-3" cy="7" rx="5.5" ry="3.5" fill="{colors[name]}" opacity=".84"/><ellipse class="tail-2" cx="-11" cy="7" rx="4.3" ry="2.7" fill="{colors[name]}" opacity=".64"/><ellipse class="tail-3" cx="-18" cy="7" rx="3.1" ry="2" fill="{colors[name]}" opacity=".44"/><ellipse class="tail-2" cx="-24" cy="7" rx="2.1" ry="1.35" fill="{colors[name]}" opacity=".25"/>')
                  game.append('</g>')

                  game.append(f'<g style="animation:ride_{name} {durations[name]}s steps(1,end) infinite;animation-delay:{phase[name]}s">')
                  if vehicle[name]["type"]=="bike":
                      game.append('<circle cx="0" cy="11" r="3.1" fill="none" stroke="#eafff0" stroke-width="1.4"/><circle cx="15" cy="11" r="3.1" fill="none" stroke="#eafff0" stroke-width="1.4"/><path d="M0 11L6 5L10 11H15M6 5H12" fill="none" stroke="#2cff88" stroke-width="1.7"/><ellipse cx="8" cy="2.8" rx="3.8" ry="2.5" fill="'+colors[name]+'"/><path class="boost-line" d="M-4 5H-18M-5 9H-24M-3 13H-16" stroke="#2cff88" stroke-width="1.5" stroke-linecap="round"/>')
                  else:
                      game.append('<rect x="-2" y="4" width="22" height="9" rx="2.5" fill="#32a8ff" stroke="#d9f1ff" stroke-width=".8"/><path d="M3 4L7 0H14L18 4" fill="#0b2335" stroke="#d9f1ff" stroke-width=".8"/><circle cx="3" cy="14" r="2.4" fill="#07100a" stroke="#d9f1ff"/><circle cx="16" cy="14" r="2.4" fill="#07100a" stroke="#d9f1ff"/><ellipse cx="10" cy="2" rx="3.3" ry="2.2" fill="'+colors[name]+'"/><path class="boost-line" d="M-5 6H-20M-6 10H-26" stroke="#32a8ff" stroke-width="1.7" stroke-linecap="round"/>')
                  game.append('</g></g>')

                  # every food square is exactly on the route and disappears only at crossing
                  for n,(route_idx,spawn) in enumerate(food_plan[name],1):
                      route_idx=min(route_idx,len(points)-2)
                      x,y=points[route_idx]; eat=pct[route_idx]
                      if spawn>=eat: spawn=max(0,eat-7)
                      anim=f'food_{name}_{n}'
                      if spawn<=0:
                          kf=f'0%,{max(0,eat-.6):.3f}%{{opacity:1;transform:scale(1)}}{max(0,eat-.18):.3f}%{{opacity:1;transform:scale(1.22)}}{eat:.3f}%,99.75%{{opacity:0;transform:scale(.3)}}100%{{opacity:1;transform:scale(1)}}'
                      else:
                          kf=f'0%,{max(0,spawn-.2):.3f}%{{opacity:0;transform:scale(.4)}}{spawn:.3f}%,{max(spawn,eat-.6):.3f}%{{opacity:1;transform:scale(1)}}{max(spawn,eat-.18):.3f}%{{opacity:1;transform:scale(1.22)}}{eat:.3f}%,100%{{opacity:0;transform:scale(.3)}}'
                      css.append(f'@keyframes {anim}'+'{'+kf+'}')
                      fc=food_colors[(n + (0 if name=="a" else 2 if name=="b" else 4)) % len(food_colors)]
                      game.append(f'<rect class="game-food" x="{x}" y="{y}" width="12" height="12" rx="2" ry="2" fill="{fc}" style="color:{fc};transform-box:fill-box;transform-origin:center;animation:{anim} {durations[name]}s steps(1,end) infinite;animation-delay:{phase[name]}s"/>')

              game.append('</g>')
              s=s.replace("</desc>","</desc>"+base_css+'<style id="matrix-world-animations">'+''.join(css)+'</style>'+''.join(glyphs),1)
              s=s.replace('<rect class="u u0"',''.join(game)+'<rect class="u u0"',1)

              event_css = r'''<style id="matrix-events-v8-style">
@keyframes bomb1{0%,13%{opacity:0;transform:scale(.5)}14%,18%{opacity:1;transform:scale(1)}19%{opacity:1;transform:scale(1.18)}20%,100%{opacity:0;transform:scale(.2)}}
@keyframes boom1{0%,19%{opacity:0;transform:scale(.2)}20%{opacity:1;transform:scale(.6)}22%{opacity:.75;transform:scale(1.8)}24%,100%{opacity:0;transform:scale(2.5)}}
@keyframes spawnD{0%,20%{opacity:0;transform:translate(250px,150px) rotate(-90deg)}21%{opacity:1;transform:translate(250px,132px) rotate(-90deg)}24%{opacity:1;transform:translate(250px,98px) rotate(0deg)}27.5%{opacity:1;transform:translate(386px,98px) rotate(0deg)}28%,100%{opacity:0;transform:translate(386px,98px)}}
@keyframes bikeParkD{0%,20%{opacity:0}21%,27.6%{opacity:1}28%,100%{opacity:0}}
@keyframes bikeRideD{0%,27.7%{opacity:0;transform:translate(386px,98px)}28%{opacity:1;transform:translate(386px,98px) rotate(0deg)}34%{opacity:1;transform:translate(610px,98px) rotate(0deg)}39%{opacity:1;transform:translate(818px,66px) rotate(-25deg)}42%{opacity:0;transform:translate(850px,50px) rotate(-25deg)}100%{opacity:0}}
@keyframes bomb2{0%,58%{opacity:0;transform:scale(.5)}59%,64%{opacity:1;transform:scale(1)}65%{opacity:1;transform:scale(1.18)}66%,100%{opacity:0;transform:scale(.2)}}
@keyframes boom2{0%,65%{opacity:0;transform:scale(.2)}66%{opacity:1;transform:scale(.6)}68%{opacity:.7;transform:scale(1.8)}70%,100%{opacity:0;transform:scale(2.5)}}
@keyframes spawnE{0%,66%{opacity:0;transform:translate(610px,150px) rotate(-90deg)}67%{opacity:1;transform:translate(610px,130px) rotate(-90deg)}70%{opacity:1;transform:translate(610px,98px) rotate(180deg)}76%{opacity:1;transform:translate(500px,66px) rotate(-160deg)}82%{opacity:1;transform:translate(370px,34px) rotate(180deg)}86%,100%{opacity:0;transform:translate(320px,34px) rotate(180deg)}}
@keyframes mergeL{0%,40%{opacity:0;transform:translate(250px,50px)}41%{opacity:1;transform:translate(250px,50px)}48%{opacity:1;transform:translate(410px,50px)}49%,100%{opacity:0;transform:translate(420px,50px)}}
@keyframes mergeR{0%,40%{opacity:0;transform:translate(590px,50px) rotate(180deg)}41%{opacity:1;transform:translate(590px,50px) rotate(180deg)}48%{opacity:1;transform:translate(430px,50px) rotate(180deg)}49%,100%{opacity:0;transform:translate(420px,50px) rotate(180deg)}}
@keyframes mergeFlash{0%,48%{opacity:0;transform:scale(.3)}49%{opacity:1;transform:scale(.8)}51%{opacity:.8;transform:scale(2)}53%,100%{opacity:0;transform:scale(2.8)}}
@keyframes mergeChild{0%,49%{opacity:0;transform:translate(420px,50px) rotate(-15deg)}50%{opacity:1;transform:translate(420px,50px) rotate(-15deg)}57%{opacity:1;transform:translate(520px,18px) rotate(-15deg)}65%{opacity:1;transform:translate(690px,34px) rotate(5deg)}70%,100%{opacity:0;transform:translate(760px,34px) rotate(5deg)}}
@keyframes eventTrail{0%,100%{opacity:.2;transform:scaleX(.7)}50%{opacity:1;transform:scaleX(1.3)}}
.event-bomb{filter:drop-shadow(0 0 4px rgba(255,77,103,.95));transform-box:fill-box;transform-origin:center}
.event-ring{fill:none;stroke:#ff4d67;stroke-width:1.5;filter:drop-shadow(0 0 4px rgba(255,77,103,.9));transform-box:fill-box;transform-origin:center}
.event-swimmer{filter:drop-shadow(0 0 3px rgba(44,255,136,.9))}
.event-boost{animation:eventTrail .18s linear infinite;transform-box:fill-box;transform-origin:right center}
</style>'''
              event_layer = r'''<g id="matrix-events-v8" aria-hidden="true">
<g transform="translate(250 98)"><g class="event-bomb" style="animation:bomb1 58s ease-in-out infinite"><circle cx="0" cy="0" r="6.2" fill="#151515" stroke="#ff4d67" stroke-width="1.2"/><path d="M4 -5C8 -10 10 -8 12 -12" fill="none" stroke="#ffd166" stroke-width="1.2"/><circle cx="12" cy="-12" r="1.6" fill="#ffd166"/></g><circle class="event-ring" cx="0" cy="0" r="8" style="animation:boom1 58s ease-out infinite"/></g>
<g class="event-swimmer" style="animation:spawnD 58s linear infinite"><ellipse class="snake-head" cx="7" cy="7" rx="7.8" ry="5.7" fill="#2cff88"/><ellipse class="tail-1" cx="-3" cy="7" rx="5.5" ry="3.5" fill="#2cff88" opacity=".84"/><ellipse class="tail-2" cx="-11" cy="7" rx="4.3" ry="2.7" fill="#2cff88" opacity=".64"/><ellipse class="tail-3" cx="-18" cy="7" rx="3.1" ry="2" fill="#2cff88" opacity=".44"/><ellipse class="tail-2" cx="-24" cy="7" rx="2.1" ry="1.35" fill="#2cff88" opacity=".25"/></g>
<g transform="translate(386 98)" style="animation:bikeParkD 58s steps(1,end) infinite"><circle cx="0" cy="11" r="3.1" fill="none" stroke="#eafff0" stroke-width="1.4"/><circle cx="15" cy="11" r="3.1" fill="none" stroke="#eafff0" stroke-width="1.4"/><path d="M0 11L6 5L10 11H15M6 5H12" fill="none" stroke="#2cff88" stroke-width="1.7"/></g>
<g style="animation:bikeRideD 58s linear infinite"><circle cx="0" cy="11" r="3.1" fill="none" stroke="#eafff0" stroke-width="1.4"/><circle cx="15" cy="11" r="3.1" fill="none" stroke="#eafff0" stroke-width="1.4"/><path d="M0 11L6 5L10 11H15M6 5H12" fill="none" stroke="#2cff88" stroke-width="1.7"/><ellipse cx="8" cy="2.8" rx="3.8" ry="2.5" fill="#2cff88"/><path class="event-boost" d="M-4 5H-18M-5 9H-26M-3 13H-17" stroke="#2cff88" stroke-width="1.6" stroke-linecap="round"/></g>

<g transform="translate(610 98)"><g class="event-bomb" style="animation:bomb2 74s ease-in-out infinite"><circle cx="0" cy="0" r="6.2" fill="#151515" stroke="#ff4d67" stroke-width="1.2"/><path d="M4 -5C8 -10 10 -8 12 -12" fill="none" stroke="#ffd166" stroke-width="1.2"/><circle cx="12" cy="-12" r="1.6" fill="#ffd166"/></g><circle class="event-ring" cx="0" cy="0" r="8" style="animation:boom2 74s ease-out infinite"/></g>
<g class="event-swimmer" style="animation:spawnE 74s linear infinite"><ellipse class="snake-head" cx="7" cy="7" rx="7.8" ry="5.7" fill="#63ff9d"/><ellipse class="tail-1" cx="-3" cy="7" rx="5.5" ry="3.5" fill="#63ff9d" opacity=".84"/><ellipse class="tail-2" cx="-11" cy="7" rx="4.3" ry="2.7" fill="#63ff9d" opacity=".64"/><ellipse class="tail-3" cx="-18" cy="7" rx="3.1" ry="2" fill="#63ff9d" opacity=".44"/><ellipse class="tail-2" cx="-24" cy="7" rx="2.1" ry="1.35" fill="#63ff9d" opacity=".25"/></g>

<g class="event-swimmer" style="animation:mergeL 93s linear infinite"><ellipse class="snake-head" cx="7" cy="7" rx="7.8" ry="5.7" fill="#63ff9d"/><ellipse class="tail-1" cx="-3" cy="7" rx="5.5" ry="3.5" fill="#63ff9d" opacity=".84"/><ellipse class="tail-2" cx="-11" cy="7" rx="4.3" ry="2.7" fill="#63ff9d" opacity=".64"/><ellipse class="tail-3" cx="-18" cy="7" rx="3.1" ry="2" fill="#63ff9d" opacity=".44"/><ellipse class="tail-2" cx="-24" cy="7" rx="2.1" ry="1.35" fill="#63ff9d" opacity=".25"/></g>
<g class="event-swimmer" style="animation:mergeR 93s linear infinite"><ellipse class="snake-head" cx="7" cy="7" rx="7.8" ry="5.7" fill="#b2ffcb"/><ellipse class="tail-1" cx="-3" cy="7" rx="5.5" ry="3.5" fill="#b2ffcb" opacity=".84"/><ellipse class="tail-2" cx="-11" cy="7" rx="4.3" ry="2.7" fill="#b2ffcb" opacity=".64"/><ellipse class="tail-3" cx="-18" cy="7" rx="3.1" ry="2" fill="#b2ffcb" opacity=".44"/><ellipse class="tail-2" cx="-24" cy="7" rx="2.1" ry="1.35" fill="#b2ffcb" opacity=".25"/></g>
<circle class="event-ring" cx="420" cy="57" r="9" stroke="#b2ffcb" style="animation:mergeFlash 93s ease-out infinite"/>
